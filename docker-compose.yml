# Container names carry a prefix so they cannot collide with another project's
# containers on the same machine — a name is global to the Docker daemon, and a
# fork of this boilerplate holding `boilerplate-postgres` made `just up` fail
# with "container name is already in use". Override CONTAINER_PREFIX in .env to
# run two checkouts of this repo side by side.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ${CONTAINER_PREFIX:-react-nest}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boilerplate_dev
    ports:
      # Override POSTGRES_PORT when another project already holds 5432.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d boilerplate_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_PREFIX:-react-nest}-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Dev SMTP. Every email the API sends lands here instead of a real inbox, so
  # a developer machine can never mail a real address — and the burst a retry
  # loop produces can never get the production relay to block the IP.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: ${CONTAINER_PREFIX:-react-nest}-mailpit
    restart: unless-stopped
    environment:
      # Any username and password, so the app's own SMTP settings stay realistic:
      # MailService builds no transporter when SMTP_USER or SMTP_PASS is blank,
      # and then the SMTP path is exercised by nobody until production.
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      # Plain auth over an unencrypted local hop; nothing here leaves the machine.
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      # A ring buffer, not a mailbox: a long dev session cannot fill the disk.
      MP_MAX_MESSAGES: '2000'
    ports:
      # 1025 is SMTP, 8025 is the web UI that replaces reading the API's logs.
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # MinIO withdrew its public images in October 2025 — `minio/minio` and
  # `quay.io/minio/minio` now refuse unauthenticated pulls on every tag,
  # historical ones included — and the project points at its paid product
  # instead. `bitnamilegacy/minio` is an unmaintained mirror of the last free
  # build (2025.5.24), which carries a reported auth-bypass (CVSS 8.8) that
  # nobody will patch. That is acceptable for a bucket of images reachable only
  # from a laptop; it is not acceptable in production, so a deployment points
  # `S3_ENDPOINT` at a managed S3 service rather than this image.
  #
  # The bucket stays private. The API never hands a browser a bucket URL; it
  # signs a short-lived GET per request, and signs a PUT for uploads so the file
  # goes straight from the browser to MinIO instead of through NestJS.
  # ---------------------------------------------------------------------------
  minio:
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    container_name: ${CONTAINER_PREFIX:-react-nest}-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Created on first boot, so no init container has to race the healthcheck.
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-app-private}
    ports:
      # 9000 is the S3 API, 9001 the console at http://localhost:9001.
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      # `mc` ships in this image, but not configured: curl the liveness probe.
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Observability stack for local development, behind the `tracing` profile so
  # the everyday `just up` stays four containers. Start it with
  # `just observability`.
  #
  # Tempo holds traces, Prometheus metrics, Loki logs, Grafana shows all three.
  # The API ships nothing until its three switches are set in apps/api/.env:
  # OTEL_EXPORTER_OTLP_ENDPOINT (traces), PROMETHEUS_METRICS_PORT (metrics,
  # scraped rather than pushed) and LOKI_URL (logs). A running stack with blank
  # switches collects nothing, and no part of it fails loudly to say so.
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.6.1
    container_name: ${CONTAINER_PREFIX:-react-nest}-tempo
    profiles: ['tracing', 'full']
    restart: unless-stopped
    # The image's entrypoint is the binary itself, so the config path is an
    # argument rather than a command.
    command: ['-config.file=/etc/tempo/tempo.yaml']
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      # 4318 is OTLP/HTTP (what the API uses), 4317 OTLP/gRPC, 3200 Tempo's own
      # API — Grafana reaches 3200 over the compose network, but publishing it
      # makes `curl localhost:3200/api/echo` a usable liveness check.
      - '${TEMPO_OTLP_HTTP_PORT:-4318}:4318'
      - '${TEMPO_OTLP_GRPC_PORT:-4317}:4317'
      - '${TEMPO_HTTP_PORT:-3200}:3200'

  grafana:
    image: grafana/grafana:11.3.0
    container_name: ${CONTAINER_PREFIX:-react-nest}-grafana
    profiles: ['tracing', 'full']
    restart: unless-stopped
    environment:
      # Anonymous admin, no login form: a local trace viewer behind a password
      # is friction with nothing behind it. Never copy this to a deployment.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Admin'
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      # Opens on the provisioned dashboard instead of the welcome page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: '/var/lib/grafana/dashboards/api-traces.json'
      GF_FEATURE_TOGGLES_ENABLE: 'traceqlEditor'
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Not 3000: the API already holds it.
      - '${GRAFANA_PORT:-3001}:3000'
    depends_on:
      - tempo
      - prometheus
      - loki

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ${CONTAINER_PREFIX:-react-nest}-prometheus
    profiles: ['tracing', 'full']
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Tempo's metrics-generator PUSHES span metrics; a scrape-only Prometheus
      # answers 404 on /api/v1/write and the generator retries forever.
      - '--web.enable-remote-write-receiver'
      # Needed by the exemplar link that jumps from a metric to the trace.
      - '--enable-feature=exemplar-storage'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    extra_hosts:
      # Docker Desktop defines this already; plain Linux does not, and without
      # it the `api` scrape job cannot reach a host-run `just dev`.
      - 'host.docker.internal:host-gateway'

  loki:
    image: grafana/loki:3.2.1
    container_name: ${CONTAINER_PREFIX:-react-nest}-loki
    profiles: ['tracing', 'full']
    restart: unless-stopped
    command: ['-config.file=/etc/loki/loki.yaml']
    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - '${LOKI_PORT:-3100}:3100'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ${CONTAINER_PREFIX:-react-nest}-api
    profiles: ['app', 'full']
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      PORT: '3000'
      NODE_ENV: 'development'
      DATABASE_URL: 'postgres://postgres:postgres@postgres:5432/boilerplate_dev'
      REDIS_URL: 'redis://redis:6379'
      # The containerised API reaches Mailpit by service name, not localhost.
      SMTP_HOST: 'mailpit'
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      # The containerised API reaches MinIO by service name, not localhost.
      S3_ENDPOINT: 'http://minio:9000'
      # Same for Tempo. The host .env points at localhost, which inside the
      # container is the container itself. Blank when the `tracing` profile is
      # not running: an unset endpoint means spans are created and not shipped,
      # while a dead endpoint means a retry loop in the exporter.
      OTEL_EXPORTER_OTLP_ENDPOINT: '${COMPOSE_OTEL_ENDPOINT:-}'
      LOKI_URL: '${COMPOSE_LOKI_URL:-}'
      # Scraped at api:9464 by the `api-container` job, not published to the
      # host: a scrape endpoint has no reason to leave the compose network.
      PROMETHEUS_METRICS_PORT: '${COMPOSE_METRICS_PORT:-}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
  tempo-data:
  grafana-data:
  prometheus-data:
  loki-data:
