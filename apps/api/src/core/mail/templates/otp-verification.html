<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify your account</title>
  </head>
  <body style="margin: 0; padding: 24px; background: #f4f4f5; font-family: Arial, sans-serif; color: #18181b;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellspacing="0" cellpadding="24" style="background: #ffffff; border-radius: 8px;">
            <tr>
              <td>
                <p>Hello <strong>{{recipientName}}</strong>,</p>
                <p>Use the code below to verify your email address and activate your account:</p>
                <p style="font-size: 32px; letter-spacing: 8px; font-weight: 700; margin: 24px 0;">{{otp}}</p>
                <p>This code expires in {{ttlMinutes}} minutes. Never share it with anyone.</p>
                <p style="color: #71717a; font-size: 13px;">If you did not create an account, ignore this email.</p>
                <p style="color: #71717a; font-size: 13px;">&copy; {{year}}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
