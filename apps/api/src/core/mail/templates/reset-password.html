<h1 style="margin: 0 0 16px; font-size: 22px; line-height: 30px; font-weight: 600; color: #1f2329">
  {{otp}} is your {{appName}} verification code
</h1>

<p style="margin: 0 0 12px; font-size: 15px; line-height: 24px">
  Hello <strong>{{recipientName}}</strong>,
</p>

<p style="margin: 0 0 20px; font-size: 15px; line-height: 24px">
  Enter the code below to reset your password. It expires in {{ttlMinutes}} minutes.
</p>

<!-- One cell per digit: the digit boxes are built in the service, because a
     template cannot loop. -->
<table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 0 0 24px">
  <tr>
    {{otpCells}}
  </tr>
</table>

<p style="margin: 0; font-size: 13px; line-height: 20px; color: #8f959e">
  Never share this code with anyone. If you did not request a password reset, ignore this email —
  your password stays unchanged.
</p>
