# Single-binary Loki with filesystem storage: enough for one laptop, nothing
# like a deployment (which runs the components apart, on object storage).
auth_enabled: false

server:
  http_listen_port: 3100
  # Pino ships a batch per interval; the default 4MB cap is never reached, but
  # a long-running dev session with a tight loop can produce a big one.
  grpc_server_max_recv_msg_size: 8388608

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # A dev machine replays old logs after a restart; rejecting them as "too old"
  # reads like Loki is broken.
  reject_old_samples: false
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
