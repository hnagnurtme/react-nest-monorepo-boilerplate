# Single-binary Tempo for local development. Every component runs in one
# process; a deployment splits them, and none of this file applies there.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        # The API ships over HTTP (OTLPTraceExporter from
        # @opentelemetry/exporter-trace-otlp-http). gRPC is open too so another
        # service can point at 4317 without editing this file.
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Default is 30m. A trace is only searchable once its block is cut, so on a
  # laptop that means half an hour of "my request is not here".
  max_block_duration: 1m

# RED metrics and the service graph, generated from the spans Tempo already
# receives, then pushed to Prometheus. This is the cheap half of metrics: no
# API code produces it. The expensive half (pool saturation, event loop lag)
# still has to come from the API's own meter.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

# A processor only runs for tenants that ask for it; single-tenant local Tempo
# has no per-tenant overrides file, so the default list is where it is turned
# on. Without this block metrics_generator is configured and idle.
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
