apiVersion: 1

providers:
  - name: local
    type: file
    # Editable in the UI, but an edit dies with the container: the file on disk
    # is the source of truth and gets re-read every 10s.
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
