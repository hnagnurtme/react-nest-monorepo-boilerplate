# Production deployment stack: api + cloudflared.
# Postgres (Neon) and Redis (Redis Cloud) are managed services; URLs come from Doppler.
# Enforces docs/rules/10-infra-devops.md
name: app-prod

services:
  api:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-app}/api:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: app-api
    restart: unless-stopped
    stop_grace_period: 30s # 10-infra-devops.md C5: Graceful shutdown
    # Not published to the host: only cloudflared (same network) reaches the API.
    expose:
      - '3000'
    env_file:
      - path: .env.production
        required: false
      - path: .env
        required: false
    environment:
      PORT: '3000'
      NODE_ENV: production
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/healthz || exit 1']
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - internal-net
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

  # Cloudflare Tunnel: outbound-only connection, Cloudflare terminates TLS.
  # Routing lives in cloudflared/config.yml; credentials in .env.tunnel (written by deploy.sh).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: app-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    env_file:
      - .env.tunnel
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal-net
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

networks:
  internal-net:
    driver: bridge
